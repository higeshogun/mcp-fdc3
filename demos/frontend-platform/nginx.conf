server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy Whisper ASR requests to avoid CORS rejection in iOS Safari & browsers
    location /api/whisper/ {
        proxy_pass https://whisper.kumatech.net/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host whisper.kumatech.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Proxy LLM requests to avoid CORS issues
    location /api/llm/ {
        proxy_pass https://myllm.kumatech.net/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host myllm.kumatech.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Proxy TTS requests to avoid CORS issues
    location /api/tts/ {
        proxy_pass https://tts.kumatech.net/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host tts.kumatech.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }


    # Serve standalone demo app HTML files
    location /demos/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # SPA fallback: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    add_header X-Content-Type-Options "nosniff";
    # Note: X-Frame-Options intentionally omitted so demo apps can be iframed
}
